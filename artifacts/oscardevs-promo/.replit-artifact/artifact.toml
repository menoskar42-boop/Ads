kind = "video"
previewPath = "/"
title = "OscarDevs Promotional Video"
videoAspectRatio = "16:9"
description = "A short Arabic promotional motion video introducing OscarDevs digital services and business management solutions."
version = "1.0.0"
id = "artifacts/oscardevs-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25007

[services.development]
run = "pnpm --filter @workspace/oscardevs-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oscardevs-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/oscardevs-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25007"
BASE_PATH = "/"
