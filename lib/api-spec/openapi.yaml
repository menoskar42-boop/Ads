openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: messenger
    description: Private Oscar Messaging operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /messenger/profile:
    get:
      operationId: getMessengerProfile
      tags: [messenger]
      summary: Get the signed-in user's Messenger profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile, or null when setup is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMessengerProfile
      tags: [messenger]
      summary: Create or update the signed-in user's public profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Username is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/voice-messages/capability:
    get:
      operationId: getMessengerVoiceMessageCapability
      tags: [messenger]
      summary: Check whether voice messages are configured
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Voice-message availability and upload limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceMessageCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messenger/people:
    get:
      operationId: searchMessengerPeople
      tags: [messenger]
      summary: Search public Messenger usernames and display names
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 60
      responses:
        "200":
          description: Matching public profiles
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    maxItems: 20
                    items:
                      $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Search rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messenger/conversations:
    get:
      operationId: listMessengerConversations
      tags: [messenger]
      summary: List conversations for the signed-in user
      security:
        - BearerAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The user's conversations
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: startMessengerConversation
      tags: [messenger]
      summary: Start or return a one-to-one conversation by username
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Messenger profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/features/capability:
    get:
      operationId: getMessengerFeaturesCapability
      tags: [messenger]
      summary: Check whether private media and message tools are configured
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Feature availability and safe attachment limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessengerFeaturesCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messenger/search:
    get:
      operationId: searchMessengerMessages
      tags: [messenger]
      summary: Search messages in the signed-in user's conversations
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching messages from the user's private conversations
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 40
                    items:
                      $ref: "#/components/schemas/MessageSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messenger/conversations/{conversationId}/settings:
    patch:
      operationId: updateMessengerConversationSettings
      tags: [messenger]
      summary: Pin, mute, or archive one conversation for the signed-in user
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationSettingsInput"
      responses:
        "200":
          description: Updated private conversation settings
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: "#/components/schemas/ConversationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Message tools migration is not applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/messages/{messageId}/reactions:
    post:
      operationId: toggleMessengerMessageReaction
      tags: [messenger]
      summary: Add or remove a simple reaction on a conversation message
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
                  enum: ["👍", "❤️", "😂", "😮", "🙏"]
      responses:
        "200":
          description: Current reaction counts
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageReaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation or message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/media:
    post:
      operationId: uploadMessengerMedia
      tags: [messenger]
      summary: Upload one small private image, video, or document
      description: Upload limit is 8 MiB per file; media bytes are stored outside the database.
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: X-Client-Message-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
        - name: X-Original-Filename
          in: header
          required: true
          schema:
            type: string
            maxLength: 180
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Private attachment stored and message created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File is larger than 8 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Storage or database migration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/messages/{messageId}/media:
    get:
      operationId: getMessengerMedia
      tags: [messenger]
      summary: Open an attachment for a member of its conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private attachment bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation or attachment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/messages/{messageId}/forward:
    post:
      operationId: forwardMessengerMessage
      tags: [messenger]
      summary: Forward a message to a destination conversation
      security:
        - BearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetConversationId]
              properties:
                targetConversationId:
                  type: string
      responses:
        "201":
          description: Forwarded message created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Source or destination is not available to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Message tools or storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/messages:
    get:
      operationId: listMessengerMessages
      tags: [messenger]
      summary: List recent messages in a conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendMessengerMessage
      tags: [messenger]
      summary: Send a text message to a conversation member
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, clientMessageId]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
                clientMessageId:
                  type: string
                  minLength: 8
                  maxLength: 80
                  replyToMessageId:
                    type: string
                    minLength: 8
                    maxLength: 80
      responses:
        "200":
          description: Previously saved message returned after a retry
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "201":
          description: Message saved
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/audio-messages:
    post:
      operationId: sendMessengerVoiceMessage
      tags: [messenger]
      summary: Upload a short voice message to a conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
        - name: X-Client-Message-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
        - name: durationMs
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 120000
      requestBody:
        required: true
        content:
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/webm:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Previously saved voice message returned after a retry
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "201":
          description: Voice message saved
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Voice message exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Voice storage or database metadata is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/conversations/{conversationId}/messages/{messageId}/audio:
    get:
      operationId: getMessengerVoiceMessageAudio
      tags: [messenger]
      summary: Stream a voice message to a conversation member
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      responses:
        "200":
          description: Private voice file
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/webm:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation or voice message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Voice storage or database metadata is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messenger/scheduled-messages:
    get:
      operationId: listMessengerScheduledMessages
      tags: [messenger]
      summary: List scheduled messages created by the signed-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Scheduled messages and their latest statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMessagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /messenger/conversations/{conversationId}/scheduled-messages:
    post:
      operationId: createMessengerScheduledMessage
      tags: [messenger]
      summary: Schedule a text message for one conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledMessageInput"
      responses:
        "200":
          description: Previously saved schedule returned after a retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMessageResponse"
        "201":
          description: Message scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /messenger/scheduled-messages/{scheduledMessageId}:
    patch:
      operationId: updateMessengerScheduledMessage
      tags: [messenger]
      summary: Edit a scheduled message before it is sent
      security:
        - BearerAuth: []
      parameters:
        - name: scheduledMessageId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledMessageUpdate"
      responses:
        "200":
          description: Updated scheduled message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Scheduled message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: cancelMessengerScheduledMessage
      tags: [messenger]
      summary: Cancel a scheduled message before it is sent
      security:
        - BearerAuth: []
      parameters:
        - name: scheduledMessageId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      responses:
        "200":
          description: Scheduled message cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelScheduledMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Scheduled message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /messenger/conversations/{conversationId}/read:
    post:
      operationId: markMessengerConversationRead
      tags: [messenger]
      summary: Mark messages from the other member as read
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 80
      responses:
        "200":
          description: Read status updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The scheduled message can no longer be changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Profile:
      type: object
      required: [userId, username, displayName, createdAt]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    ProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
    ProfileInput:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        displayName:
          type: string
          minLength: 1
          maxLength: 60
    Person:
      type: object
      required: [userId, username, displayName]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
    Message:
      type: object
      required:
        - id
        - conversationId
        - senderId
        - body
        - createdAt
        - deliveredAt
        - readAt
        - messageType
        - audioDurationMs
        - audioUrl
        - mediaAttachment
        - replyToMessageId
        - replyPreview
        - forwarded
        - reactions
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        readAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        messageType:
          type: string
          enum: [text, audio, media]
        audioDurationMs:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 120000
            - type: "null"
        audioUrl:
          anyOf:
            - type: string
              format: uri-reference
            - type: "null"
        mediaAttachment:
          anyOf:
            - $ref: "#/components/schemas/MediaAttachment"
            - type: "null"
        replyToMessageId:
          anyOf:
            - type: string
            - type: "null"
        replyPreview:
          anyOf:
            - $ref: "#/components/schemas/ReplyPreview"
            - type: "null"
        forwarded:
          type: boolean
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReaction"
    MediaAttachment:
      type: object
      required: [filename, contentType, kind, sizeBytes, url]
      properties:
        filename:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm, application/pdf, text/plain]
        kind:
          type: string
          enum: [image, video, file]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
        url:
          type: string
          format: uri-reference
    ReplyPreview:
      type: object
      required: [id, body, messageType]
      properties:
        id:
          type: string
        body:
          type: string
        messageType:
          type: string
          enum: [text, audio, media]
    MessageReaction:
      type: object
      required: [emoji, count, reactedByMe]
      properties:
        emoji:
          type: string
          enum: ["👍", "❤️", "😂", "😮", "🙏"]
        count:
          type: integer
          minimum: 1
        reactedByMe:
          type: boolean
    MessageSearchResult:
      type: object
      required: [id, conversationId, senderId, peerName, body, messageType, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        peerName:
          type: string
        body:
          type: string
        messageType:
          type: string
          enum: [text, audio, media]
        createdAt:
          type: string
          format: date-time
    MessengerFeaturesCapability:
      type: object
      required: [enabled, mediaEnabled, maxMediaBytes, allowedContentTypes, reason]
      properties:
        enabled:
          type: boolean
        mediaEnabled:
          type: boolean
        maxMediaBytes:
          type: integer
          enum: [8388608]
        allowedContentTypes:
          type: array
          items:
            type: string
            enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm, application/pdf, text/plain]
        reason:
          anyOf:
            - type: string
              enum: [database_update_required, storage_not_configured]
            - type: "null"
    ConversationSettings:
      type: object
      required: [isPinned, isMuted, isArchived]
      properties:
        isPinned:
          type: boolean
        isMuted:
          type: boolean
        isArchived:
          type: boolean
    ConversationSettingsInput:
      type: object
      minProperties: 1
      properties:
        isPinned:
          type: boolean
        isMuted:
          type: boolean
        isArchived:
          type: boolean
    VoiceMessageCapability:
      type: object
      required: [enabled, maxDurationMs, maxBytes, reason]
      properties:
        enabled:
          type: boolean
        maxDurationMs:
          type: integer
          enum: [120000]
        maxBytes:
          type: integer
          enum: [4194304]
        reason:
          anyOf:
            - type: string
              enum: [storage_not_configured, database_update_required]
            - type: "null"
    ScheduledMessageStatus:
      type: string
      enum: [pending, sent, failed, cancelled]
    ScheduledMessage:
      type: object
      required:
        - id
        - conversationId
        - peerName
        - body
        - scheduledAt
        - status
        - createdAt
        - sentAt
        - failureMessage
      properties:
        id:
          type: string
        conversationId:
          type: string
        peerName:
          type: string
        body:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ScheduledMessageStatus"
        createdAt:
          type: string
          format: date-time
        sentAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        failureMessage:
          anyOf:
            - type: string
            - type: "null"
    ScheduledMessagesResponse:
      type: object
      required: [scheduledMessages]
      properties:
        scheduledMessages:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledMessage"
    ScheduledMessageResponse:
      type: object
      required: [scheduledMessage]
      properties:
        scheduledMessage:
          $ref: "#/components/schemas/ScheduledMessage"
    CancelScheduledMessageResponse:
      type: object
      required: [ok, scheduledMessage]
      properties:
        ok:
          type: boolean
        scheduledMessage:
          $ref: "#/components/schemas/ScheduledMessage"
    ScheduledMessageInput:
      type: object
      required: [body, scheduledAt, clientScheduleId]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        scheduledAt:
          type: string
          format: date-time
        clientScheduleId:
          type: string
          minLength: 8
          maxLength: 80
    ScheduledMessageUpdate:
      type: object
      required: [body, scheduledAt]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        scheduledAt:
          type: string
          format: date-time
    Conversation:
      type: object
      required: [id, peer, lastMessage, unreadCount, updatedAt, isPinned, isMuted, isArchived]
      properties:
        id:
          type: string
        peer:
          $ref: "#/components/schemas/Person"
        lastMessage:
          anyOf:
            - type: string
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        isPinned:
          type: boolean
        isMuted:
          type: boolean
        isArchived:
          type: boolean
