<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sokro — مساعدك بالصوت</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b1020" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/sokro-icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sokro" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif;margin:0}
  body{background:radial-gradient(1000px 600px at 50% -10%,#1b2550,#0b1020);color:#eef1ff;min-height:100vh;display:flex;flex-direction:column}
  .top{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
  .brand{font-weight:900;font-size:1.1rem}.brand span{background:linear-gradient(90deg,#7c8bff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:#9aa2cf}
  .wrap{flex:1;max-width:720px;width:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column}
  /* auth */
  #auth{margin:auto;width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px}
  #auth h2{margin-bottom:6px}#auth p{color:#9aa2cf;font-size:.9rem;margin-bottom:16px}
  .fld{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:#fff;font-size:1rem;margin-bottom:10px}
  .lbl2{display:block;color:#9aa2cf;font-size:.82rem;margin:10px 2px 4px}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1rem;cursor:pointer;background:linear-gradient(90deg,#5b6cff,#22d3ee);color:#08122b}
  .link{background:none;border:0;color:#8ea2ff;cursor:pointer;font:inherit;text-decoration:underline;margin-top:10px}
  .err{color:#ff9a9a;font-size:.85rem;margin-bottom:8px;min-height:1em}
  /* chat */
  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px 16px}
  .msg{max-width:85%;padding:11px 14px;border-radius:16px;line-height:1.75;font-size:.96rem;display:flex;flex-direction:column;gap:4px}
  .msg .msg-text{white-space:pre-wrap}
  .me{align-self:flex-start;background:#2a356b}
  .ai{align-self:flex-end;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
  .ai.think{color:#9aa2cf;font-style:italic}
  .dots{display:inline-flex;gap:4px;vertical-align:middle;margin-inline-start:4px}
  .dots span{width:7px;height:7px;border-radius:50%;background:#8ea2ff;display:inline-block;animation:dotpulse 1.3s infinite both}
  .dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
  @keyframes dotpulse{0%,75%,100%{opacity:.25;transform:scale(.8)}35%{opacity:1;transform:scale(1)}}
  .think.stalled .dots span{animation:none;opacity:.5;transform:none;background:#6b7299}
  .copybtn{align-self:flex-end;background:transparent;border:0;color:inherit;opacity:.5;cursor:pointer;font-size:.82rem;padding:1px 3px;line-height:1;border-radius:6px}
  .copybtn:hover{opacity:1;background:rgba(255,255,255,.08)}
  .copybtn.ok{opacity:1}
  .plan{align-self:flex-end;max-width:85%;background:rgba(120,140,255,.10);border:1px solid rgba(120,140,255,.3);border-radius:16px;padding:12px 14px;font-size:.9rem}
  .plan ol{margin:6px 18px 10px}.plan .perms{color:#ffd58a;font-size:.82rem;margin-bottom:8px}
  .plan .row{display:flex;gap:8px;margin-top:8px}
  .plan .row button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;cursor:pointer}
  .ok{background:#22d3ee;color:#062033}.no{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eef1ff}
  /* mic */
  .dock{padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
  .status{font-size:.85rem;color:#9aa2cf;min-height:1.1em}
  .microw{display:flex;align-items:center;gap:12px;width:100%;max-width:520px}
  #text{flex:1;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:12px 18px;color:#fff;font-size:1rem}
  #mic{width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#5b6cff,#22d3ee);color:#08122b;font-size:1.8rem;box-shadow:0 8px 30px rgba(91,108,255,.45);transition:transform .12s}
  #mic:active{transform:scale(.94)}
  #mic.rec{animation:pulse 1.1s infinite;background:linear-gradient(135deg,#ff5b6c,#ff9a3c)}
  #send{width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:1.7rem;box-shadow:0 8px 30px rgba(34,197,94,.4);transition:transform .12s;flex:none;display:flex;align-items:center;justify-content:center}
  #attach{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cdd6ff;font-size:1.2rem;cursor:pointer;flex:none}
  #attach:hover{background:rgba(255,255,255,.12)}
  #pendbar{display:flex;align-items:center;gap:8px;width:100%;max-width:520px;margin-bottom:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 10px}
  #pendbar img{width:42px;height:42px;object-fit:cover;border-radius:8px}
  #pendbar .rm{margin-inline-start:auto;background:transparent;border:0;color:#ff9a9a;cursor:pointer;font-size:1.1rem}
  #send:active{transform:scale(.94)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,91,108,.5)}50%{box-shadow:0 0 0 16px rgba(255,91,108,0)}}
  .hidden{display:none!important}
  #extlink{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:14px;z-index:40;display:inline-flex;align-items:center;gap:6px;
    background:rgba(120,140,255,.16);border:1px solid rgba(120,140,255,.4);color:#cdd6ff;
    text-decoration:none;font-weight:800;font-size:.85rem;border-radius:100px;padding:9px 15px;
    box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  #extlink:hover{background:rgba(120,140,255,.28)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Sokro <span>OS</span></div>
    <div style="display:flex;gap:14px;align-items:center">
      <button id="mute" class="link hidden" style="margin:0;font-size:1.1rem;text-decoration:none" title="قراءة الرد بصوت">🔈</button>
      <button id="gear" class="link hidden" style="margin:0">⚙️ إعدادات</button>
      <button id="logout" class="link hidden" style="margin:0">خروج</button>
    </div>
  </div>

  <div class="wrap">
    <!-- Auth -->
    <div id="auth">
      <h2 id="authTitle">أهلاً بيك 👋</h2>
      <p id="authSub">سجّل دخولك عشان تبدأ تكلّم Sokro بصوتك.</p>
      <div class="err" id="authErr"></div>
      <input id="name" class="fld hidden" placeholder="اسمك" />
      <input id="email" class="fld" type="email" dir="ltr" placeholder="الإيميل" />
      <input id="password" class="fld" type="password" placeholder="كلمة السر (٨ أحرف على الأقل)" />
      <button id="authBtn" class="btn">دخول</button>
      <button id="authToggle" class="link">معندكش حساب؟ اعمل واحد</button>
    </div>

    <!-- Assistant -->
    <div id="app" class="hidden" style="flex:1;display:flex;flex-direction:column">
      <div id="log"></div>
    </div>
  </div>

  <div id="settings" class="hidden" style="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;max-width:420px;background:#141b3a;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px" onclick="event.stopPropagation()">
      <h2 style="margin-bottom:12px">⚙️ إعدادات المساعد</h2>
      <label class="lbl2">اسم المساعد</label>
      <input id="setName" class="fld" placeholder="Selena" />
      <label class="lbl2">الشخصية</label>
      <select id="setPersona" class="fld">
        <option value="professional">احترافي</option>
        <option value="friendly">ودود</option>
        <option value="funny">مرِح</option>
        <option value="minimal">مختصر</option>
        <option value="teacher">معلّم</option>
      </select>
      <label class="lbl2">الصوت</label>
      <select id="setVoice" class="fld"><option value="female">أنثى</option><option value="male">ذكر</option></select>
      <label class="lbl2">لغة الردّ</label>
      <select id="setLang" class="fld"><option value="egyptian">مصري</option><option value="msa">فصحى</option><option value="english">English</option></select>
      <label class="lbl2">جيميل (Gmail API)</label>
      <div id="gmailBox" style="display:flex;align-items:center;gap:10px;font-size:13px;color:#6b7280">
        <span id="gmailState">جارٍ الفحص…</span>
        <a id="gmailConnect" href="/api/gmail/connect" class="hidden" style="color:#2563eb;text-decoration:none;font-weight:600">اربط جيميل ←</a>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button id="setSave" class="btn" style="flex:1">حفظ</button>
        <button id="setClose" class="no" style="flex:1;border-radius:12px;padding:13px">إغلاق</button>
      </div>
    </div>
  </div>

  <a id="extlink" class="hidden" href="/ext" target="_blank" rel="noopener" title="ثبّت إضافة المتصفح عشان Sokro يتصفّح المواقع بنفسه">🧩 المتصفح</a>
  <audio id="rtaudio" autoplay></audio>
  <div id="dock" class="dock hidden">
    <div class="status" id="status">اكتب طلبك… أو اضغط 📞 لمكالمة صوتية</div>
    <div id="pendbar" class="hidden"></div>
    <div class="microw">
      <button id="attach" title="أضف صورة أو ملف">📎</button>
      <input id="file" type="file" accept="image/*,.txt,.csv,.md,.json,.log,.html,.xml,.yml,.yaml,.docx,.zip,.rar" style="display:none" />
      <input id="text" placeholder="اكتب طلبك هنا…" />
      <button id="send" class="hidden" title="إرسال">➤</button>
      <button id="call" title="مكالمة صوتية مباشرة — اتكلم معاه" style="width:74px;height:74px;border-radius:50%;border:0;background:linear-gradient(135deg,#5b6cff,#22d3ee);color:#fff;font-size:1.7rem;cursor:pointer;flex:none;box-shadow:0 8px 30px rgba(91,108,255,.45);transition:transform .12s">📞</button>
      <button id="mic" style="display:none" aria-hidden="true">🎤</button>
    </div>
  </div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js').catch(function(){}); }catch(e){} }
  // Keep the screen awake while Sokro is open (mobile + desktop). Wake locks are
  // auto-released when the tab is hidden, so re-acquire when it becomes visible.
  var wakeLock=null;
  async function requestWake(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',function(){ wakeLock=null; }); } }catch(e){} }
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && !wakeLock) requestWake(); });
  // Some browsers only grant a wake lock after a user gesture — re-try on the
  // first tap/click so the screen actually stays on.
  document.addEventListener('pointerdown',function(){ if(!wakeLock) requestWake(); },{passive:true});
  var mode='login';
  var audioEl=new Audio();
  // TTS is OPT-IN: replies are text-first (cheaper, clearer). The user turns on
  // "read aloud" when they want it; the choice persists. The live call is a
  // separate explicit mode and always plays its own audio.
  var speakAloud=false;
  try{ speakAloud = localStorage.getItem('sokro_speak')==='1'; }catch(e){}
  var convId=null;
  var SETTINGS={ assistantName:'Selena', voice:'female', lang:'egyptian', personality:'professional' };
  async function loadHistory(){
    try{
      var r=await fetch('/api/conversations'); var d=await r.json();
      if(d.ok && d.conversations && d.conversations.length){
        convId=d.conversations[0].id;
        var m=await fetch('/api/conversations/'+convId+'/messages'); var md=await m.json();
        if(md.ok && md.messages && md.messages.length){
          md.messages.forEach(function(msg){ addMsg(msg.role==='user'?'me':'ai', msg.content); });
          return true;
        }
      }
    }catch(e){}
    return false;
  }
  async function loadSettings(){ try{ var r=await fetch('/api/settings'); var d=await r.json(); if(d.ok) SETTINGS=d.settings; }catch(e){} }
  function openSettings(){ $('#setName').value=SETTINGS.assistantName||''; $('#setPersona').value=SETTINGS.personality||'professional'; $('#setVoice').value=SETTINGS.voice||'female'; $('#setLang').value=SETTINGS.lang||'egyptian'; $('#settings').classList.remove('hidden'); refreshGmail(); }
  async function refreshGmail(){
    var s=$('#gmailState'), a=$('#gmailConnect'); if(!s) return;
    try{ var d=await (await fetch('/api/gmail/status')).json();
      if(!d.configured){ s.textContent='غير مُفعّل على الخادم'; a.classList.add('hidden'); }
      else if(d.connected){ s.textContent='مربوط ✓'; a.textContent='إعادة الربط ←'; a.classList.remove('hidden'); }
      else{ s.textContent='مش مربوط'; a.textContent='اربط جيميل ←'; a.classList.remove('hidden'); }
    }catch(e){ s.textContent='—'; }
  }
  async function saveSettingsForm(){
    var patch={ assistantName:$('#setName').value.trim()||'Selena', personality:$('#setPersona').value, voice:$('#setVoice').value, lang:$('#setLang').value };
    var btn=$('#setSave'), orig=btn.textContent; btn.disabled=true; btn.textContent='…';
    try{ var r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)}); var d=await r.json(); SETTINGS=(d&&d.ok&&d.settings)?d.settings:Object.assign({},SETTINGS,patch); }
    catch(e){ SETTINGS=Object.assign({},SETTINGS,patch); }
    btn.disabled=false; btn.textContent=orig; $('#settings').classList.add('hidden');
  }

  // ---------- auth ----------
  function showAuth(){ $('#auth').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#dock').classList.add('hidden'); $('#logout').classList.add('hidden'); }
  async function showApp(user){ $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#dock').classList.remove('hidden');
    $('#logout').classList.remove('hidden'); $('#gear').classList.remove('hidden');
    $('#mute').classList.remove('hidden'); $('#mute').textContent=speakAloud?'🔊':'🔈';
    $('#extlink').classList.remove('hidden');
    requestWake(); // keep the screen on while using Sokro
    loadSettings();
    var had=await loadHistory();
    if(!had && !$('#log').dataset.greeted){ $('#log').dataset.greeted='1'; addMsg('ai','أهلاً'+(user&&user.display_name?(' '+user.display_name):'')+'! قوللي عايز إيه — أبحث، أعملك تقرير، اخلقلك صورة، أو أي مهمة.'); }
  }
  // Direct handlers — the modal's inner wrapper calls event.stopPropagation(),
  // so clicks on these never bubble to a document-level delegate.
  $('#gear').onclick=openSettings;
  $('#mute').onclick=function(){ speakAloud=!speakAloud; $('#mute').textContent=speakAloud?'🔊':'🔈'; $('#mute').title=speakAloud?'إيقاف القراءة بصوت':'قراءة الرد بصوت'; try{ localStorage.setItem('sokro_speak', speakAloud?'1':'0'); }catch(e){} if(!speakAloud) stopSpeaking(); };
  $('#setSave').onclick=saveSettingsForm;
  $('#setClose').onclick=function(){ $('#settings').classList.add('hidden'); };
  $('#settings').addEventListener('click',function(e){ if(e.target.id==='settings') $('#settings').classList.add('hidden'); });
  $('#authToggle').onclick=function(){ mode=mode==='login'?'signup':'login';
    $('#name').classList.toggle('hidden',mode==='login');
    $('#authBtn').textContent=mode==='login'?'دخول':'إنشاء حساب';
    $('#authTitle').textContent=mode==='login'?'أهلاً بيك 👋':'حساب جديد';
    $('#authToggle').textContent=mode==='login'?'معندكش حساب؟ اعمل واحد':'عندك حساب؟ سجّل دخول';
  };
  $('#authBtn').onclick=async function(){
    $('#authErr').textContent='';
    var body={email:$('#email').value.trim(),password:$('#password').value};
    if(mode==='signup') body.name=$('#name').value.trim();
    try{
      var r=await fetch('/api/auth/'+(mode==='signup'?'signup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var d=await r.json();
      if(!d.ok){ $('#authErr').textContent=d.error||'حصل خطأ'; return; }
      showApp(d.user);
    }catch(e){ $('#authErr').textContent='تعذّر الاتصال'; }
  };
  $('#logout').onclick=async function(){ await fetch('/api/auth/logout',{method:'POST'}); location.reload(); };

  // ---------- chat ----------
  function scrollToBottom(){ try{ var l=$('#log'); if(l) l.scrollTop=l.scrollHeight; }catch(e){} try{ window.scrollTo(0,document.body.scrollHeight); }catch(e){} }
  function copyText(t,btn){
    function done(){ if(!btn)return; var o=btn.textContent; btn.textContent='✓'; btn.classList.add('ok'); setTimeout(function(){ btn.textContent=o; btn.classList.remove('ok'); },1200); }
    function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){} }
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,function(){ fallback(); done(); }); } else { fallback(); done(); } }catch(e){ fallback(); done(); }
  }
  function addMsg(who,text,cls){
    var d=document.createElement('div'); d.className='msg '+(who==='me'?'me':'ai')+(cls?' '+cls:'');
    var body=document.createElement('div'); body.className='msg-text'; body.textContent=text; d.appendChild(body);
    if(cls!=='think'){ var b=document.createElement('button'); b.type='button'; b.className='copybtn'; b.title='نسخ'; b.textContent='📋'; b.onclick=function(){ copyText(text,b); }; d.appendChild(b); }
    $('#log').appendChild(d); scrollToBottom(); return d;
  }
  // Animated "working" bubble: the 3 dots pulse while a task runs; if it drags on
  // (>45s) they freeze to hint it's taking unusually long (maybe stuck).
  function addThinking(label){
    var d=document.createElement('div'); d.className='msg ai think';
    var body=document.createElement('div'); body.className='msg-text';
    body.appendChild(document.createTextNode((label||'بشتغل على طلبك')+' '));
    var dots=document.createElement('span'); dots.className='dots'; dots.innerHTML='<span></span><span></span><span></span>';
    body.appendChild(dots); d.appendChild(body); $('#log').appendChild(d); scrollToBottom();
    d._stall=setTimeout(function(){ d.classList.add('stalled'); if(body.firstChild) body.firstChild.textContent='أخدت وقت أطول من المعتاد، لسه بشتغل '; }, 45000);
    return d;
  }
  function endThinking(el){ if(!el)return; try{ clearTimeout(el._stall); }catch(e){} el.remove(); }

  // Barge-in: stop whatever the assistant is currently saying so replies never
  // stack/overlap (a common issue with the browser TTS fallback).
  function stopSpeaking(){ try{ audioEl.pause(); audioEl.currentTime=0; }catch(e){} try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
  async function speak(text){
    if(!text || !speakAloud) return; // opt-in: no TTS call at all unless enabled
    stopSpeaking();
    try{
      var r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})});
      if(r.ok){ var b=await r.blob(); audioEl.src=URL.createObjectURL(b); audioEl.play().catch(function(){ setStatus('اضغط 🔊 لو الصوت مش شغّال'); }); return; }
    }catch(e){}
    try{ var u=new SpeechSynthesisUtterance(text); u.lang='ar-EG'; speechSynthesis.speak(u); }catch(e){}
  }

  function renderResult(d){
    var report=null, images=[];
    (d.results||[]).forEach(function(r){ var o=r.result&&r.result.output; if(o){ if(o.report) report={ title:o.topic||'تقرير', text:o.report, rows:o.sources||null }; if(o.imageUrl) images.push(o.imageUrl); } });
    var summary=d.summary||(report?report.text:(d.ok?'تمّت المهمة.':'المهمة فشلت.'));
    addMsg('ai',summary);
    images.forEach(addImage);
    if(report) addDownloads(report);
    speak(summary);
  }
  // Reliable download for both data: URLs (what gpt-image-1 returns) and http(s).
  // A plain <a download> often just OPENS a big data URL, so convert it to a Blob.
  function downloadUrl(url,filename){
    try{
      if(String(url).indexOf('data:')===0){
        var parts=url.split(','); var mime=((parts[0].match(/:(.*?);/)||[])[1])||'image/png';
        var bin=atob(parts[1]); var arr=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        var u=URL.createObjectURL(new Blob([arr],{type:mime}));
        var a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(u);},2000);
      } else {
        var a2=document.createElement('a'); a2.href=url; a2.download=filename; document.body.appendChild(a2); a2.click(); a2.remove();
      }
    }catch(e){ try{ window.open(url,'_blank'); }catch(_){} }
  }
  var imgSeq=0;
  function addImage(url){
    var el=document.createElement('div'); el.className='msg ai'; el.style.padding='6px';
    var img=document.createElement('img'); img.src=url; img.alt='صورة مولّدة'; img.style.cssText='max-width:100%;border-radius:12px;display:block;cursor:zoom-in';
    img.onclick=function(){ try{ window.open(url,'_blank'); }catch(e){} };
    el.appendChild(img);
    var bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;margin-top:8px;align-items:center';
    var dl=document.createElement('button'); dl.className='ok'; dl.style.cssText='border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer';
    dl.textContent='⬇︎ تحميل الصورة';
    var name='sokro-image-'+(++imgSeq)+'.png';
    dl.onclick=function(){ downloadUrl(url,name); };
    var open=document.createElement('a'); open.href=url; open.target='_blank'; open.textContent='فتح في تبويب'; open.style.cssText='color:#8ea2ff;font-size:.88rem';
    bar.appendChild(dl); bar.appendChild(open); el.appendChild(bar);
    $('#log').appendChild(el); scrollToBottom();
  }
  function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // PDF via the USER's browser print dialog (Save as PDF): perfect Arabic, works
  // regardless of server RAM — the server Chromium can't run on 0.5 GiB.
  function printReport(payload){
    var w=window.open('','_blank');
    if(!w){ addMsg('ai','فعّل النوافذ المنبثقة عشان أطلّعلك الـ PDF (طباعة → حفظ كـ PDF).'); return; }
    var rows=(payload.rows||[]).map(function(r){ return '<li>'+escH(r.title||'')+(r.url?(' — <span style="color:#2555c0">'+escH(r.url)+'</span>'):'')+'</li>'; }).join('');
    var html='<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+escH(payload.title||'تقرير')+'</title>'
      +'<style>*{font-family:system-ui,\'Segoe UI\',Tahoma,sans-serif}body{padding:26px;line-height:1.9;color:#111}'
      +'h1{font-size:22px;border-bottom:2px solid #5b6cff;padding-bottom:8px}.t{white-space:pre-wrap;font-size:14px}'
      +'h2{font-size:16px;margin-top:20px}li{margin-bottom:5px;font-size:13px}.foot{margin-top:28px;color:#888;font-size:10px;border-top:1px solid #ddd;padding-top:6px}</style></head><body>'
      +'<h1>'+escH(payload.title||'تقرير')+'</h1><div class="t">'+escH(payload.text||'')+'</div>'
      +(rows?'<h2>المصادر</h2><ul>'+rows+'</ul>':'')
      +'<div class="foot">تقرير من Sokro — sokro.oscardevs.com</div></body></html>';
    w.document.write(html); w.document.close();
    setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 500);
  }
  function addDownloads(payload){
    var el=document.createElement('div'); el.className='plan'; el.style.background='rgba(34,211,238,.08)';
    el.innerHTML='<div>⬇︎ تنزيل التقرير:</div><div class="row"><button class="ok" data-f="pdf">PDF</button><button class="ok" data-f="xlsx">Excel</button><button class="ok" data-f="md">Markdown</button></div>';
    $('#log').appendChild(el); scrollToBottom();
    el.querySelectorAll('button').forEach(function(btn){ btn.onclick=function(){ if(btn.dataset.f==='pdf') printReport(payload); else dl(btn.dataset.f,payload); }; });
  }
  async function dl(format,payload){
    var ext={pdf:'pdf',xlsx:'xlsx',csv:'csv',json:'json',md:'md'}[format]||'md';
    try{
      var r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({format:format},payload))});
      if(!r.ok){ var e=await r.json().catch(function(){return{};}); addMsg('ai','تعذّر إنشاء الملف: '+(e.error||('HTTP '+r.status))); return; }
      var b=await r.blob(); var u=URL.createObjectURL(b);
      var a=document.createElement('a'); a.href=u; a.download=(payload.title||'report')+'.'+ext; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},2000);
    }catch(e){ addMsg('ai','تعذّر تنزيل الملف.'); }
  }

  function renderConsent(d){
    var el=document.createElement('div'); el.className='plan';
    var steps=(d.plan||[]).map(function(s){return '<li>'+ (s.action||'') + (s.reason?(' — '+s.reason):'') +'</li>'}).join('');
    var perms=(d.permissions&&d.permissions.sensitive||[]).join('، ');
    el.innerHTML='<div>هعمل الخطوات دي:</div><ol>'+steps+'</ol>'+(perms?'<div class="perms">⚠️ يتطلب إذن: '+perms+'</div>':'')+'<div class="row"><button class="ok">أأكّد ✅</button><button class="no">إلغاء</button></div>';
    $('#log').appendChild(el); scrollToBottom();
    speak('هعمل '+((d.plan||[]).length)+' خطوات، ويتطلب إذن: '+(perms||'لا شيء')+'. أأكّد؟');
    el.querySelector('.ok').onclick=async function(){ el.querySelector('.row').innerHTML='<span class="muted">بنفّذ…</span>';
      try{ var r=await fetch('/api/run/'+d.taskId+'/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); renderResult(await r.json()); }
      catch(e){ addMsg('ai','تعذّر التنفيذ.'); }
    };
    el.querySelector('.no').onclick=function(){ el.querySelector('.row').innerHTML='<span class="muted">اتلغى.</span>'; };
  }

  async function run(text){
    if(!text||!text.trim()) return;
    stopSpeaking(); // silence the previous reply the moment a new one starts
    addMsg('me',text);
    var think=addThinking('بفكّر وبخطّط');
    try{
      var r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:text,conversationId:convId})});
      var d=await r.json();
      if(d.conversationId) convId=d.conversationId;
      endThinking(think);
      if(d.requiresConsent){ renderConsent(d); return; }
      // A plan that RAN (has a summary or results) — even if it didn't fully
      // succeed (e.g. search found nothing) — shows its real outcome, not the
      // generic "not in my capabilities" (which is only for a truly empty plan).
      if(d.summary || (Array.isArray(d.results) && d.results.length)){ renderResult(d); return; }
      addMsg('ai', d.message || d.error || 'مش قادر أحدّد المطلوب — جرّب مثلاً «ابحثلي عن أسعار كذا» أو «ارسملي صورة قطة».');
    }catch(e){ endThinking(think); addMsg('ai','تعذّر الاتصال بالسيرفر.'); }
  }
  // WhatsApp-style composer: show the send button while typing (hide the mic),
  // send on Enter or on the ➤ button, and always scroll to the newest message.
  // ---------- attachments (image the model can read) ----------
  var pendingImage=null, pendingFile=null;
  $('#attach').onclick=function(){ $('#file').click(); };
  $('#file').onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(!f){return;}
    pendingImage=null; pendingFile=null;
    if(f.type&&f.type.indexOf('image/')===0){ var r=new FileReader(); r.onload=function(){ pendingImage=r.result; showPending(); toggleSend(); }; r.readAsDataURL(f); }
    else { pendingFile=f; showPending(); toggleSend(); }
    e.target.value=''; };
  function clearPend(){ pendingImage=null; pendingFile=null; showPending(); toggleSend(); }
  function showPending(){ var b=$('#pendbar');
    if(pendingImage){ b.classList.remove('hidden'); b.innerHTML='<img src="'+pendingImage+'"><span style="font-size:.85rem;color:#c3c9ee">صورة جاهزة تتبعت</span><button class="rm" title="شيل">✕</button>'; }
    else if(pendingFile){ b.classList.remove('hidden'); b.innerHTML='<span style="font-size:1.2rem">📄</span><span style="font-size:.85rem;color:#c3c9ee">'+pendingFile.name.replace(/[<>]/g,'')+'</span><button class="rm" title="شيل">✕</button>'; }
    else { b.classList.add('hidden'); b.innerHTML=''; return; }
    b.querySelector('.rm').onclick=clearPend; }
  async function runFile(text,file){
    addMsg('me',(text?text+' ':'')+'📄 '+file.name);
    var think=addThinking('بقرأ الملف');
    try{ var fd=new FormData(); fd.append('file',file); fd.append('text',text||''); if(convId) fd.append('conversationId',convId);
      var r=await fetch('/api/file',{method:'POST',body:fd}); var d=await r.json(); endThinking(think); if(d.conversationId) convId=d.conversationId;
      if(d.ok&&d.answer){ addMsg('ai',d.answer); speak(d.answer); } else addMsg('ai', d.error||'معرفتش أقرا الملف.'); }
    catch(e){ endThinking(think); addMsg('ai','تعذّر قراءة الملف.'); } }
  // Send typed text (and/or an image) INTO an active call over the data channel,
  // so the live model sees what you type/attach mid-conversation.
  function sendToCall(text,image){
    if(!rtDc||rtDc.readyState!=='open'){ addMsg('ai','المكالمة مش جاهزة لسه.'); return; }
    var content=[]; if(image) content.push({type:'input_image',image_url:image}); if(text) content.push({type:'input_text',text:text});
    if(!content.length) return;
    if(image) addImage(image); if(text) addMsg('me',text);
    try{ rtDc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:content}})); rtDc.send(JSON.stringify({type:'response.create'})); }catch(e){}
  }
  async function runVision(text,image){
    if(image) addImage(image); if(text) addMsg('me',text);
    var think=addThinking('بشوف الصورة');
    try{ var r=await fetch('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,image:image,conversationId:convId})});
      var d=await r.json(); endThinking(think); if(d.conversationId) convId=d.conversationId;
      if(d.ok&&d.answer){ addMsg('ai',d.answer); speak(d.answer); } else addMsg('ai','معرفتش أقرا الصورة: '+(d.error||'')); }
    catch(e){ endThinking(think); addMsg('ai','تعذّر تحليل الصورة.'); }
  }
  // ---------- composer: one button (📞 → ➤ while typing), image-aware ----------
  function toggleSend(){ var has=$('#text').value.trim().length>0 || !!pendingImage || !!pendingFile; $('#send').classList.toggle('hidden',!has); $('#call').classList.toggle('hidden',has); }
  function sendText(){ var t=$('#text').value.trim(); var img=pendingImage, file=pendingFile; if(!t&&!img&&!file)return;
    $('#text').value=''; pendingImage=null; pendingFile=null; showPending(); toggleSend();
    if(file){ runFile(t,file); }
    else if(rtOn){ sendToCall(t,img); }
    else if(img){ runVision(t,img); }
    else { run(t); }
    scrollToBottom(); }
  $('#text').addEventListener('input',toggleSend);
  $('#text').addEventListener('focus',scrollToBottom);
  $('#text').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); } });
  $('#send').onclick=sendText;

  // ---------- voice input ----------
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var rec=null,recording=false,mediaRec=null,chunks=[];
  function setStatus(t){ $('#status').textContent=t; }
  function micOn(){ $('#mic').classList.add('rec'); recording=true; }
  function micOff(){ $('#mic').classList.remove('rec'); recording=false; }

  async function startWhisper(){
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=function(e){ chunks.push(e.data); };
      mediaRec.onstop=async function(){ stream.getTracks().forEach(function(t){t.stop()}); setStatus('بحوّل كلامك…');
        var blob=new Blob(chunks,{type:'audio/webm'}); var fd=new FormData(); fd.append('audio',blob,'v.webm');
        try{ var r=await fetch('/api/voice',{method:'POST',body:fd}); var d=await r.json(); setStatus('دوس المايك وقول اللي عايزه'); if(d.ok&&d.text) run(d.text); else addMsg('ai','مسمعتش كويس، جرّب تاني.'); }
        catch(e){ setStatus('دوس المايك وقول اللي عايزه'); addMsg('ai','تعذّر تحويل الصوت.'); }
      };
      mediaRec.start(); micOn(); setStatus('🔴 بسمعك… دوس تاني لما تخلص');
    }catch(e){ setStatus('مش قادر أوصل للمايك'); }
  }

  $('#mic').onclick=function(){
    if(SR){
      if(recording){ rec&&rec.stop(); return; }
      rec=new SR(); rec.lang='ar-EG'; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onstart=function(){ micOn(); setStatus('🔴 بسمعك…'); };
      rec.onerror=function(){ micOff(); setStatus('جرّب تاني أو اكتب طلبك'); };
      rec.onend=function(){ micOff(); setStatus('دوس المايك وقول اللي عايزه'); };
      rec.onresult=function(e){ var t=e.results[0][0].transcript; if(t) run(t); };
      rec.start();
    } else {
      if(recording){ mediaRec&&mediaRec.stop(); micOff(); return; }
      startWhisper();
    }
  };

  // ---------- realtime live call (OpenAI Realtime API over WebRTC) ----------
  var rtPc=null, rtStream=null, rtDc=null, rtOn=false, rtBusy=false;
  function setCall(on){ rtOn=on; $('#call').textContent=on?'⏹️':'📞'; $('#call').style.background=on?'#ff5b6c':'linear-gradient(135deg,#5b6cff,#22d3ee)'; setStatus(on?'🟢 مكالمة مباشرة — اتكلم عادي، هو بيسمعك':'اكتب طلبك… أو اضغط 📞 لمكالمة صوتية'); }
  async function startRealtime(){
    if(rtPc||rtBusy) return; // guard: a double-tap must not open two overlapping calls
    rtBusy=true;
    try{
      setStatus('🎙️ بيطلب إذن المايك…');
      rtStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).catch(function(){ throw new Error('محتاج إذن الميكروفون'); });
      setStatus('🔗 بيتصل بالمكالمة…');
      var sres=await fetch('/api/realtime/session',{method:'POST'}); var sd=await sres.json();
      if(!sd.ok||!sd.clientSecret){ addMsg('ai','تعذّر بدء المكالمة: '+(sd.error||'راجع OPENAI_API_KEY')); endRealtime(); return; }
      rtPc=new RTCPeerConnection();
      rtPc.ontrack=function(e){ var rt=$('#rtaudio'); rt.srcObject=e.streams[0]; rt.play&&rt.play().catch(function(){}); };
      // Connection health: reflect drops in the UI and end cleanly instead of a silent dead call.
      rtPc.onconnectionstatechange=function(){ if(!rtPc)return; var s=rtPc.connectionState;
        if(s==='connected'){ rtBusy=false; setCall(true); }
        else if(s==='failed'){ addMsg('ai','المكالمة اتقطعت (الشبكة). اضغط 📞 تاني.'); endRealtime(); }
        else if(s==='disconnected'){ setStatus('⚠️ الاتصال بيتقطّع…'); } };
      rtStream.getTracks().forEach(function(t){ rtPc.addTrack(t,rtStream); });
      rtDc=rtPc.createDataChannel('oai-events'); rtDc.onmessage=onRtEvent;
      var offer=await rtPc.createOffer(); await rtPc.setLocalDescription(offer);
      var r=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',body:offer.sdp,headers:{Authorization:'Bearer '+sd.clientSecret,'Content-Type':'application/sdp'}});
      if(!r.ok){ addMsg('ai','تعذّر الاتصال بالمكالمة ('+r.status+').'); endRealtime(); return; }
      await rtPc.setRemoteDescription({type:'answer',sdp:await r.text()});
      setCall(true);
    }catch(e){ addMsg('ai','تعذّر بدء المكالمة: '+e.message); endRealtime(); }
  }
  function endRealtime(){ rtBusy=false; try{rtDc&&rtDc.close();}catch(e){} try{rtPc&&rtPc.close();}catch(e){} try{rtStream&&rtStream.getTracks().forEach(function(t){t.stop();});}catch(e){} try{var rt=$('#rtaudio'); if(rt){ rt.srcObject=null; }}catch(e){} rtPc=null;rtStream=null;rtDc=null; setCall(false); }
  // Voice command to hang up: the model can't close the WebRTC (it's on the
  // client), so we detect end-phrases in the user's own transcript and end here.
  function isEndCall(t){
    var s=String(t||'').toLowerCase().trim().replace(/[.،,!؟]/g,' ');
    if(/hang ?up|end (the )?call|stop (the )?call|goodbye|bye bye/.test(s)) return true;
    // any close/stop/end verb near a call word (order-independent, small gap)
    if(/(اقفل|قفل|اغلق|أغلق|اوقف|أوقف|وقّف|وقف|سكّر|سكر|انهي|أنهي|إنهاء|انهاء|خلص|كفايه|كفاية|بس كده)[^]{0,12}(المكالمة|المكالمه|مكالمة|مكالمه|الكول|كول|الاتصال|اتصال|التليفون)/.test(s)) return true;
    if(/(المكالمة|المكالمه|الكول|الاتصال)[^]{0,12}(اقفل|قفل|اغلق|خلاص|كفايه|كفاية|بس)/.test(s)) return true;
    // short standalone commands
    if(/^(اقفل|قفل|سكّر|سكر|خلاص خلاص|بس خلاص|كفاية كده|إنهاء)$/.test(s)) return true;
    return false;
  }
  async function onRtEvent(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    var t=m.type||'';
    // Live listening/speaking state — the ChatGPT-Voice "orb" feel.
    if(t==='input_audio_buffer.speech_started'){ if(rtOn) setStatus('👂 بيسمعك…'); }
    else if(t==='input_audio_buffer.speech_stopped'){ if(rtOn) setStatus('🟢 مكالمة مباشرة'); }
    else if(t==='response.audio.delta'||t==='response.created'){ if(rtOn) setStatus('🗣️ Sokro بيرد…'); }
    else if(t==='response.done'){ if(rtOn) setStatus('🟢 مكالمة مباشرة — اتكلم عادي'); }
    if(t==='conversation.item.input_audio_transcription.completed' && m.transcript){ addMsg('me',m.transcript); if(rtOn&&isEndCall(m.transcript)){ addMsg('ai','تمام، قفلت المكالمة.'); endRealtime(); return; } }
    else if(t==='response.audio_transcript.done' && m.transcript){ addMsg('ai',m.transcript); }
    else if(t==='response.function_call_arguments.done'){
      if(m.name==='end_call'){ addMsg('ai','تمام، قفلت المكالمة.'); endRealtime(); return; }
      await runRtTool(m.name,m.call_id,m.arguments);
    }
  }
  function toolLabel(n){ return ({search_web:'🔎 بيبحث في الويب',generate_image:'🎨 بيولّد صورة',research_report:'📊 بيبحث ويجهّز تقرير',browse:'🌐 بيفتح صفحة',extract_table:'📋 بيسحب جدول',fill_submit:'📝 بيملأ نموذج'})[n]||('⚙️ بينفّذ: '+n); }
  // Executes a tool the model asked for MID-CALL (voice-controlled agent) and
  // shows an attractive live activity chip + inline result, so you SEE Sokro
  // working while you talk to it.
  async function runRtTool(name,callId,argsStr){
    var args={}; try{ args=JSON.parse(argsStr||'{}'); }catch(e){}
    var chip=addMsg('ai',toolLabel(name)+'…','think');
    var out;
    try{
      var r=await fetch('/api/actions/'+encodeURIComponent(name)+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});
      var d=await r.json();
      if(r.status===403){ out={error:'needs confirmation'}; chip.querySelector('.msg-text').textContent='🔒 '+name+' محتاج تأكيد — نفّذها من الشات'; }
      else { out=d.output||d; try{chip.remove();}catch(e){}
        if(d&&d.output){ if(d.output.imageUrl) addImage(d.output.imageUrl); if(d.output.report) addDownloads({title:d.output.topic||'تقرير',text:d.output.report,rows:d.output.sources||null}); if(Array.isArray(d.output.results)&&d.output.results.length) addMsg('ai','✅ '+toolLabel(name).replace(/^[^ ]+ /,'')+' — لقيت '+d.output.results.length+' نتيجة'); }
      }
    }catch(e){ out={error:e.message}; try{chip.querySelector('.msg-text').textContent='⚠️ فشل: '+name;}catch(_){} }
    try{
      rtDc.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:callId,output:JSON.stringify(out).slice(0,6000)}}));
      rtDc.send(JSON.stringify({type:'response.create'}));
    }catch(e){}
  }
  $('#call').onclick=function(){ if(rtOn||rtPc||rtBusy){ endRealtime(); } else { startRealtime(); } };

  // ---------- init ----------
  (async function(){
    try{ var r=await fetch('/api/auth/me'); var d=await r.json(); if(d.ok) showApp(d.user); else showAuth(); }
    catch(e){ showAuth(); }
  })();
})();
</script>
</body>
</html>
