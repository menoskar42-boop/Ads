# Build the «Oscar Drive» APK on GitHub's runners — same reason as speedguard-apk.yml: the dev
# container blocks dl.google.com, so the Android SDK cannot install there.
#
# Published as a PRE-release on the moving tag `oscardrive-latest` (never "latest": NeuroPilot's
# link is /releases/latest/download/neuropilot.apk). oscardevs.com/apps/oscar-drive/download —
# the button on «من أعمالنا» — redirects to it (scripts/check-oscardrive.js).
name: Oscar Drive APK

on:
  workflow_dispatch:
  push:
    branches: [claude/build-oscardevs-ads-mvp-8krfN]
    paths:
      - 'oscardrive-android/**'
      - '.github/workflows/oscardrive-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating/updating the release — nothing wider

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu image already ships the Android SDK (ANDROID_HOME) with recent
      # platforms and build-tools. android-actions/setup-android@v3 failed on the
      # first run (2026-10-09), so the build uses the preinstalled one directly.
      - name: Android SDK on the runner
        run: |
          echo "sdk.dir=$ANDROID_HOME" > oscardrive-android/local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The trip/road-memory/break/maintenance/voice logic has its own JVM tests — a broken rule
      # should fail here, not on a dashboard in a moving car.
      - name: Test the drive logic
        working-directory: oscardrive-android/logic-test
        run: gradle test --no-daemon

      # جوجل بلاى + التحديث فوق القديم محتاجين توقيع ثابت: لو أسرار مفتاح التوقيع موجودة بنبنى
      # release (APK للموقع + AAB لجوجل بلاى)، ولو لأ debug زى الأول. المفتاح نفسه عمره ما بيتكتب
      # فى الكود ولا فى الـlog — بيتفك من السرّ لملف مؤقت على الـrunner بس. (docs/OSCAR_DRIVE_PLAY_STORE.md)
      - name: Signing key from secrets (optional)
        env:
          KS_B64: ${{ secrets.ODRIVE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ODRIVE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signed release build"
          else
            echo "No signing secret — debug build"
          fi

      - name: Build
        working-directory: oscardrive-android
        env:
          ODRIVE_KEYSTORE_PASSWORD: ${{ secrets.ODRIVE_KEYSTORE_PASSWORD }}
          ODRIVE_KEY_ALIAS: ${{ secrets.ODRIVE_KEY_ALIAS }}
          ODRIVE_KEY_PASSWORD: ${{ secrets.ODRIVE_KEY_PASSWORD }}
          # مفتاح خرايط جوجل (الملاحة جوه التطبيق) — فاضى = الملاحة بتفتح تطبيق الخرائط
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$ODRIVE_KEYSTORE_FILE" ]; then
            gradle assembleRelease bundleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Name the file for the download link
        id: apk
        run: |
          SRC=$(find oscardrive-android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$SRC" oscar-drive.apk
          echo "sha256=$(sha256sum oscar-drive.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          AAB=$(find oscardrive-android/app/build/outputs/bundle -name '*.aab' 2>/dev/null | head -1)
          if [ -n "$AAB" ]; then cp "$AAB" oscar-drive.aab; fi

      - name: Upload the Play bundle (AAB) to the run's artifacts
        if: hashFiles('oscar-drive.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: oscar-drive-play-aab
          path: oscar-drive.aab
          retention-days: 30

      - name: Upload the APK to the run's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oscar-drive-apk
          path: oscar-drive.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oscardrive-latest
          prerelease: true
          make_latest: false
          files: oscar-drive.apk
          name: Oscar Drive APK
          body: |
            Oscar Drive — تطبيق أندرويد واحد لشاشة العربية (بالعرض): السرعة والاتجاه والرحلة،
            ذاكرة الطريق (مطبات/حفر/رادار بتنبيه قبلها)، الركن، الصيانة والبنزين، تذكير الاستراحة،
            وزرار طوارئ. من غير إنترنت ولا حساب — كله على الشاشة.

            لو أسرار التوقيع لسه مااتحطتش فى GitHub، النسخة `debug` وكل نسخة جديدة بمفتاح مختلف
            (التحديث محتاج تمسح القديمة). بعد التوقيع: التحديث بيتركّب فوق القديمة عادى.

            `SHA-256: ${{ steps.apk.outputs.sha256 }}`
